# Credentials must be supplied through environment variables or a private .env file.
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_HOST: ${SITE_HOST:?Set public domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
  postgres:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_USER: shiyu
      POSTGRES_DB: shiyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U shiyu]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    restart: unless-stopped
    build: .
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment: &app-env
      NODE_ENV: production
      SHIYU_MODE: live
      APP_ORIGIN: ${APP_ORIGIN:?Set public HTTPS origin}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      DATABASE_URL: postgresql://shiyu:${POSTGRES_PASSWORD}@postgres:5432/shiyu
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    restart: unless-stopped
    build: .
    command: [node, .server/worker/index.js]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
